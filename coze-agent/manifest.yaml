apiVersion: v1
kind: Plugin
metadata:
  author: langbot-team
  name: CozeAgent
  version: 0.1.1
  repository: https://github.com/langbot-app/langbot-agent-runner
  label:
    en_US: Coze Agent
    zh_Hans: 扣子 Agent
    zh_Hant: Coze Agent
    ja_JP: Coze Agent
    th_TH: Coze Agent
    vi_VN: Coze Agent
    es_ES: Agente Coze
    ru_RU: Агент Coze
  description:
    en_US: Run a Coze bot as a LangBot AgentRunner.
    zh_Hans: 将扣子机器人作为 LangBot AgentRunner 运行。
    zh_Hant: 將 Coze 機器人作為 LangBot AgentRunner 執行。
    ja_JP: Coze ボットを LangBot AgentRunner として実行します。
    th_TH: เรียกใช้บอต Coze เป็น LangBot AgentRunner
    vi_VN: Chạy bot Coze dưới dạng LangBot AgentRunner.
    es_ES: Ejecuta un bot de Coze como LangBot AgentRunner.
    ru_RU: Запускает бота Coze как LangBot AgentRunner.
  icon: assets/icon.svg
spec:
  config: []
  components:
    AgentRunner:
      fromDirs:
        - path: components/agent_runner/
  pages: []
execution:
  python:
    path: main.py
    attr: CozeAgentPlugin

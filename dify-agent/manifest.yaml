apiVersion: v1
kind: Plugin
metadata:
  author: langbot-team
  name: DifyAgent
  version: 0.1.3
  repository: https://github.com/langbot-app/langbot-agent-runner
  label:
    en_US: Dify Agent
    zh_Hans: Dify Agent
    zh_Hant: Dify Agent
    ja_JP: Dify Agent
    th_TH: Dify Agent
    vi_VN: Dify Agent
    es_ES: Agente Dify
    ru_RU: Агент Dify
  description:
    en_US: Run a Dify application as a LangBot AgentRunner.
    zh_Hans: 将 Dify 应用作为 LangBot AgentRunner 运行。
    zh_Hant: 將 Dify 應用程式作為 LangBot AgentRunner 執行。
    ja_JP: Dify アプリを LangBot AgentRunner として実行します。
    th_TH: เรียกใช้แอป Dify เป็น LangBot AgentRunner
    vi_VN: Chạy ứng dụng Dify dưới dạng LangBot AgentRunner.
    es_ES: Ejecuta una aplicación de Dify como LangBot AgentRunner.
    ru_RU: Запускает приложение Dify как LangBot AgentRunner.
  icon: assets/icon.svg
spec:
  config: []
  components:
    AgentRunner:
      fromDirs:
        - path: components/agent_runner/
  pages: []
execution:
  python:
    path: main.py
    attr: DifyAgentPlugin

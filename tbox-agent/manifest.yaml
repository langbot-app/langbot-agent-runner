apiVersion: v1
kind: Plugin
metadata:
  author: langbot-team
  name: TboxAgent
  version: 0.1.1
  repository: https://github.com/langbot-app/langbot-agent-runner
  label:
    en_US: Tbox Agent
    zh_Hans: 百宝箱 Agent
    zh_Hant: Tbox Agent
    ja_JP: Tbox Agent
    th_TH: Tbox Agent
    vi_VN: Tbox Agent
    es_ES: Agente Tbox
    ru_RU: Агент Tbox
  description:
    en_US: Run an Ant Tbox application as a LangBot AgentRunner.
    zh_Hans: 将蚂蚁百宝箱应用作为 LangBot AgentRunner 运行。
    zh_Hant: 將螞蟻 Tbox 應用程式作為 LangBot AgentRunner 執行。
    ja_JP: Ant Tbox アプリを LangBot AgentRunner として実行します。
    th_TH: เรียกใช้แอป Ant Tbox เป็น LangBot AgentRunner
    vi_VN: Chạy ứng dụng Ant Tbox dưới dạng LangBot AgentRunner.
    es_ES: Ejecuta una aplicación Ant Tbox como LangBot AgentRunner.
    ru_RU: Запускает приложение Ant Tbox как LangBot AgentRunner.
  icon: assets/icon.png
spec:
  config: []
  components:
    AgentRunner:
      fromDirs:
        - path: components/agent_runner/
  pages: []
execution:
  python:
    path: main.py
    attr: TboxAgentPlugin

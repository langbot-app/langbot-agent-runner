apiVersion: v1
kind: Plugin
metadata:
  author: langbot-team
  name: LangflowAgent
  version: 0.1.2
  repository: https://github.com/langbot-app/langbot-agent-runner
  label:
    en_US: Langflow Agent
    zh_Hans: Langflow Agent
    zh_Hant: Langflow Agent
    ja_JP: Langflow Agent
    th_TH: Langflow Agent
    vi_VN: Langflow Agent
    es_ES: Agente Langflow
    ru_RU: Агент Langflow
  description:
    en_US: Run a Langflow flow as a LangBot AgentRunner.
    zh_Hans: 将 Langflow 流程作为 LangBot AgentRunner 运行。
    zh_Hant: 將 Langflow 流程作為 LangBot AgentRunner 執行。
    ja_JP: Langflow フローを LangBot AgentRunner として実行します。
    th_TH: เรียกใช้โฟลว์ Langflow เป็น LangBot AgentRunner
    vi_VN: Chạy luồng Langflow dưới dạng LangBot AgentRunner.
    es_ES: Ejecuta un flujo de Langflow como LangBot AgentRunner.
    ru_RU: Запускает поток Langflow как LangBot AgentRunner.
  icon: assets/icon.svg
spec:
  config: []
  components:
    AgentRunner:
      fromDirs:
        - path: components/agent_runner/
  pages: []
execution:
  python:
    path: main.py
    attr: LangflowAgentPlugin

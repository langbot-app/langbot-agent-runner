apiVersion: v1
kind: Plugin
metadata:
  author: langbot-team
  name: DeerFlowAgent
  version: 0.1.0
  repository: https://github.com/langbot-app/langbot-agent-runner
  label:
    en_US: DeerFlow Agent
    zh_Hans: DeerFlow Agent
    zh_Hant: DeerFlow Agent
    ja_JP: DeerFlow Agent
    th_TH: DeerFlow Agent
    vi_VN: DeerFlow Agent
    es_ES: Agente DeerFlow
    ru_RU: Агент DeerFlow
  description:
    en_US: Run a DeerFlow LangGraph agent as a LangBot AgentRunner.
    zh_Hans: 将 DeerFlow LangGraph 智能体作为 LangBot AgentRunner 运行。
    zh_Hant: 將 DeerFlow LangGraph 代理作為 LangBot AgentRunner 執行。
    ja_JP: DeerFlow LangGraph エージェントを LangBot AgentRunner として実行します。
    th_TH: เรียกใช้เอเจนต์ DeerFlow LangGraph เป็น LangBot AgentRunner
    vi_VN: Chạy tác nhân DeerFlow LangGraph dưới dạng LangBot AgentRunner.
    es_ES: Ejecuta un agente DeerFlow LangGraph como LangBot AgentRunner.
    ru_RU: Запускает агент DeerFlow LangGraph как LangBot AgentRunner.
  icon: assets/icon.svg
spec:
  config: []
  components:
    AgentRunner:
      fromDirs:
        - path: components/agent_runner/
  pages: []
execution:
  python:
    path: main.py
    attr: DeerFlowAgentPlugin

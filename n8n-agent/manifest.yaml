apiVersion: v1
kind: Plugin
metadata:
  author: langbot-team
  name: N8nAgent
  version: 0.1.2
  repository: https://github.com/langbot-app/langbot-agent-runner
  label:
    en_US: N8n Agent
    zh_Hans: n8n 工作流 Agent
    zh_Hant: n8n 工作流程 Agent
    ja_JP: n8n ワークフローエージェント
    th_TH: เอเจนต์เวิร์กโฟลว์ n8n
    vi_VN: Tác nhân quy trình n8n
    es_ES: Agente de flujo n8n
    ru_RU: Агент рабочих процессов n8n
  description:
    en_US: Run an n8n workflow webhook as a LangBot AgentRunner.
    zh_Hans: 将 n8n 工作流 webhook 作为 LangBot AgentRunner 运行。
    zh_Hant: 將 n8n 工作流程 Webhook 作為 LangBot AgentRunner 執行。
    ja_JP: n8n ワークフローの Webhook を LangBot AgentRunner として実行します。
    th_TH: เรียกใช้เว็บฮุกเวิร์กโฟลว์ n8n เป็น LangBot AgentRunner
    vi_VN: Chạy webhook quy trình n8n dưới dạng LangBot AgentRunner.
    es_ES: Ejecuta un webhook de flujo de n8n como LangBot AgentRunner.
    ru_RU: Запускает webhook рабочего процесса n8n как LangBot AgentRunner.
  icon: assets/icon.svg
spec:
  config: []
  components:
    AgentRunner:
      fromDirs:
        - path: components/agent_runner/
  pages: []
execution:
  python:
    path: main.py
    attr: N8nAgentPlugin
